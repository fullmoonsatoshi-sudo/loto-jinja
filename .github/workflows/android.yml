# Google Play 用の Android アプリ（.aab）を作る。手動で実行する。
# 署名はしない（署名の鍵は GitHub に置かず、オーナーの HDD に保管している）。できた .aab はあとで鍵で署名してから Play に上げる。
name: Androidアプリを作る
on:
  workflow_dispatch:
permissions:
  contents: write  # 署名前の .aab をリリースの添付ファイルとして置くため
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: TWA プロジェクトを作る
        working-directory: tools/android
        run: npm install --no-audit --no-fund && cd ../.. && node tools/android/generate.mjs
      - name: .aab を作る（署名なし）
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: loto-jinja-aab-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: 署名前の .aab をリリースに置く（署名用に取り出すため。鍵は含まない）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(node -p "const c=require('./tools/android/app.json'); c.versionName+'-'+c.versionCode")
          tag="android-unsigned-$ver"
          cp android/app/build/outputs/bundle/release/*.aab "loto-jinja-$ver-unsigned.aab"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "Android 署名前ビルド $ver" --notes "署名前の .aab（Play には署名後のものを上げる）"
          gh release upload "$tag" "loto-jinja-$ver-unsigned.aab" --clobber
