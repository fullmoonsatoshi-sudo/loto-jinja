# Android アプリ（Capacitor のネイティブ版）を作り、エミュレーターで動きを確かめる。手動で実行する（Actions →「Androidアプリを作る」→ Run workflow）。
# できるもの（GitHub のリリース android-native-<versionName>-<versionCode> の添付ファイルに置く。クラウドからはアーティファクトを取り出せないため）：
#   ① loto-jinja-<版>-debug.apk ……………… デバッグ署名の APK（実機に入れて確かめる用）
#   ② loto-jinja-<版>-release-unsigned.aab … 署名なしの AAB（CEO が手元で本番の鍵で署名してから Play に上げる）
#   ③ loto-jinja-<版>-release-unsigned.apk … 署名なしの APK（同じく署名してから使う）
#   ④ emulator-*.png・emulator-summary.txt・emulator-logcat.txt … エミュレーターで操作したときの画面とログ（CEO・QA が見る）
# 本番の署名鍵は GitHub に置かない。版の番号は android/app/build.gradle の versionCode・versionName。
name: Androidアプリを作る
on:
  workflow_dispatch:
permissions:
  contents: write  # リリースを作って添付ファイルを置くため
concurrency:
  group: android
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Android SDK は GitHub のランナーに入っているものを使う（足りない部品は Gradle が自動で入れる）
      - name: 部品を入れる
        run: npm ci --no-audit --no-fund
      - name: テスト
        run: node tools/test.mjs
      - name: 画面のファイルをアプリに入れる（src/ → www/ → android/）
        run: npm run build:web && npx cap sync android
      - name: 版の番号
        id: ver
        run: |
          code=$(grep -oP 'versionCode\s+\K\d+' android/app/build.gradle)
          name=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          echo "ver=$name-$code" >> "$GITHUB_OUTPUT"
          echo "版：$name（$code）"
      - name: ビルド（デバッグ APK・署名なしのリリース AAB と APK）
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease assembleRelease --no-daemon --stacktrace
      - name: できたファイルをまとめる
        run: |
          v=${{ steps.ver.outputs.ver }}
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/loto-jinja-$v-debug.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/loto-jinja-$v-release-unsigned.aab"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "out/loto-jinja-$v-release-unsigned.apk"
          (cd out && sha256sum * > "loto-jinja-$v-SHA256SUMS.txt" && cat "loto-jinja-$v-SHA256SUMS.txt")
          # AdMob のアプリIDが入っていることを確かめる（src/ads-config.js の appId）
          "$ANDROID_HOME"/build-tools/*/aapt2 dump xmltree "out/loto-jinja-$v-release-unsigned.apk" --file AndroidManifest.xml | grep -A1 'gms.ads.APPLICATION_ID' | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: out/*-debug.apk
          if-no-files-found: error
      - name: リリースに置く（署名なし。鍵は含まない）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.ver.outputs.ver }}
          tag="android-native-$v"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "Android ネイティブ版 $v" \
            --notes "Capacitor のネイティブ版。debug.apk は実機確認用（デバッグ署名）。release-unsigned.aab / .apk は署名前（Play には本番の鍵で署名したものを上げる）。emulator-* はエミュレーターでの確認結果。"
          gh release upload "$tag" out/* --clobber

  emulator:
    # エミュレーターでデバッグ APK を起動し、同意 → ホーム → 神託（テスト広告）→ マイ番号 → 戻るボタン を adb で操作して画面を撮る。
    # クラウドからはみずほ銀行の公式サイトが 403 になるので、予備（GitHub Pages）に切り替わる動きを確かめることになる（それで正しい）
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: debug-apk, path: apk }
      - name: KVM を使えるようにする（エミュレーターを速くする）
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: エミュレーターで確かめる
        id: e1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/app/emulator-check.sh apk/*-debug.apk emulator-out
      - name: エミュレーターで確かめる（2回目。ソフトウェア描画のエミュレーターは動画広告のあとに応答しなくなることがあるため、1回だけやり直す）
        id: e2
        if: steps.e1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/app/emulator-check.sh apk/*-debug.apk emulator-out
      - name: 画面とログをリリースに置く
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la emulator-out || exit 0
          find emulator-out -type f -size 0 -delete  # 空のファイルは置けない
          tag="android-native-${{ needs.build.outputs.ver }}"
          # 前の実行の画面（番号が違うもの）が残らないよう、先に emulator-* を消してから置く
          gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq '.assets[] | select(.name | startswith("emulator-")) | .id' | while read id; do gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"; done
          gh release upload "$tag" emulator-out/* --clobber
      - name: 結果
        if: steps.e1.outcome == 'failure' && steps.e2.outcome != 'success'
        run: echo "エミュレーターでの確認に2回とも失敗しました（emulator-summary.txt を見てください）"; exit 1
