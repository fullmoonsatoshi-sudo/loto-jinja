# 当せん番号の自動取り込み と アプリの公開（GitHub Pages）
# - 抽せん日（月・木・金）の夜 19:00〜23:30 に30分おき：ロト6・ロト7を公式CSV（拒否されたら予備の公開データ）から取り込む
# - 月〜金の抽せんの翌朝 6:00〜10:00 に1時間おき：ミニロト（火）・ビンゴ5（水）・ナンバーズ3/4（月〜金）を公開データ lotto-data-hub から取り込む
#   （公開データの更新は日本時間0時〜8時ごろとばらつく。ロト6・ロト7の翌朝7:00の分もこの時刻に含む）
# - 変化があれば保存して公開しなおす。新しい4種類は、取り込みに失敗しても、取り込んだあとのテストが通らなくても
#   （そのときは新しい4種類の取り込みを取り消す）、ロト6・ロト7の取り込みと公開は続け、
#   最後に「新しい4種類の取り込み失敗」ジョブを失敗にして分かるようにする
# - 毎日 12:00・15:00・18:00（日本時間、週末も）：公開データの更新が遅れた日のため、新しい4種類だけを取り込む（ロト6・ロト7は取り込まない）
# - main にコードが入ったとき：テストして公開
name: 更新と公開
on:
  push:
    branches: [main]
  schedule:
    - cron: '0,30 10-14 * * 1,4,5'  # 日本時間 19:00〜23:30（月・木・金）
    - cron: '0 21,22,23 * * 1-5'    # 日本時間 翌朝 6:00・7:00・8:00（火〜土の朝。月〜金の抽せんの翌朝）
    - cron: '0 0,1 * * 2-6'         # 日本時間 翌朝 9:00・10:00（火〜土）
    - cron: '0 3,6,9 * * *'         # 日本時間 毎日 12:00・15:00・18:00（新しい4種類だけ。この値は下の if と同じにする）
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hub_failed: ${{ steps.hub.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 当せん番号を取り込む：ロト6・ロト7（定期実行・手動実行のとき。新しい4種類だけの時刻は除く）
        if: github.event_name != 'push' && github.event.schedule != '0 3,6,9 * * *'
        run: node tools/update-data.mjs loto
      - name: 当せん番号を取り込む：ミニロト・ビンゴ5・ナンバーズ（失敗してもロト6・ロト7の公開は続ける）
        id: hub
        if: github.event_name != 'push'
        run: |
          HUB_FILES="src/data/miniloto.json src/data/bingo5.json src/data/numbers3.json src/data/numbers4.json"
          if ! node tools/update-data.mjs hub; then
            echo "::error::ミニロト・ビンゴ5・ナンバーズの取り込みに失敗した種類があります（検査を通った種類だけ取り込み済み）"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          # 取り込んだデータでテストが通らなければ、新しい4種類の取り込みを取り消す（ロト6・ロト7の保存・公開を止めない）
          if ! git diff --quiet -- $HUB_FILES && ! node tools/test.mjs > /tmp/hub-test.log 2>&1; then
            tail -n 40 /tmp/hub-test.log
            echo "::error::ミニロト・ビンゴ5・ナンバーズを取り込んだあとのテストが通らないため、取り込みを取り消しました"
            git checkout -- $HUB_FILES
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: テスト
        run: node tools/test.mjs
      - name: 変化があれば保存
        if: github.event_name != 'push'
        run: |
          git config user.name "lotojinja-bot"
          git config user.email "lotojinja-bot@users.noreply.github.com"
          git add src/data
          if git diff --cached --quiet; then echo "新しい回はありません"; else git commit -m "当せん番号を更新" && git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: src }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  hub-failed:
    # 新しい4種類の取り込みに失敗したときだけ、公開のあとでこのジョブを失敗にする（実行結果が赤くなり、ログで分かる）
    needs: [build, deploy]
    if: always() && needs.build.outputs.hub_failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "ミニロト・ビンゴ5・ナンバーズの取り込みに失敗しました。build ジョブの「ミニロト・ビンゴ5・ナンバーズ」の手順のログを見てください。"
          exit 1
