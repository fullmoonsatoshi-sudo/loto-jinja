# 当せん番号の自動取り込み と アプリの公開（GitHub Pages）
# - 抽せん日（月・木・金）の夜 19:07〜23:37 に30分おき：ロト6・ロト7を公式CSV（拒否されたら予備の公開データ）から取り込む
# - 月〜金の抽せんの翌朝 6:07〜10:07 に1時間おき：ミニロト（火）・ビンゴ5（水）・ナンバーズ3/4（月〜金）を公開データ lotto-data-hub から取り込む
#   （公開データの更新は日本時間0時〜8時ごろとばらつく。ロト6・ロト7の翌朝7:00の分もこの時刻に含む）
# - 変化があれば保存して公開しなおす。新しい4種類は、取り込みに失敗しても、取り込んだあとのテストが通らなくても
#   （そのときは新しい4種類の取り込みを取り消す）、ロト6・ロト7の取り込みと公開は続け、
#   最後に「新しい4種類の取り込み失敗」ジョブを失敗にして分かるようにする
# - 毎日 12:07・15:07・18:07（日本時間、週末も）：公開データの更新が遅れた日のため、新しい4種類だけを取り込む（ロト6・ロト7は取り込まない）
# - main にコードが入ったとき：テストして公開
# ※ 定期実行の分は 0・30 ちょうどを避けて 7・37 にしている（毎時0分ちょうどは GitHub が混んで遅れたり飛ばされたりするため）
name: 更新と公開
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 10-14 * * 1,4,5'  # 日本時間 19:07〜23:37（月・木・金）
    - cron: '7 21,22,23 * * 1-5'    # 日本時間 翌朝 6:07・7:07・8:07（火〜土の朝。月〜金の抽せんの翌朝）
    - cron: '7 0,1 * * 2-6'         # 日本時間 翌朝 9:07・10:07（火〜土）
    - cron: '7 3,6,9 * * *'         # 日本時間 毎日 12:07・15:07・18:07（新しい4種類だけ。この値は下の if と同じにする）
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hub_failed: ${{ steps.hub.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 当せん番号を取り込む：ロト6・ロト7（定期実行・手動実行のとき。新しい4種類だけの時刻は除く）
        if: github.event_name != 'push' && github.event.schedule != '7 3,6,9 * * *'
        run: node tools/update-data.mjs loto
      - name: 当せん番号を取り込む：ミニロト・ビンゴ5・ナンバーズ（失敗してもロト6・ロト7の公開は続ける）
        id: hub
        if: github.event_name != 'push'
        run: |
          HUB_FILES="src/data/miniloto.json src/data/bingo5.json src/data/numbers3.json src/data/numbers4.json"
          if ! node tools/update-data.mjs hub; then
            echo "::error::ミニロト・ビンゴ5・ナンバーズの取り込みに失敗した種類があります（検査を通った種類だけ取り込み済み）"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          # 取り込んだデータでテストが通らなければ、新しい4種類の取り込みを取り消す（ロト6・ロト7の保存・公開を止めない）
          if ! git diff --quiet -- $HUB_FILES && ! node tools/test.mjs > /tmp/hub-test.log 2>&1; then
            tail -n 40 /tmp/hub-test.log
            echo "::error::ミニロト・ビンゴ5・ナンバーズを取り込んだあとのテストが通らないため、取り込みを取り消しました"
            git checkout -- $HUB_FILES
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: テスト
        run: node tools/test.mjs
      - name: 変化があれば保存
        if: github.event_name != 'push'
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          git config user.name "lotojinja-bot"
          git config user.email "lotojinja-bot@users.noreply.github.com"
          git add src/data
          if git diff --cached --quiet; then echo "新しい回はありません"; exit 0; fi
          git commit -m "当せん番号を更新"
          # ほかの push と重なると rejected になるので、取り込み直してから push し、失敗したら数回やり直す。
          # 同じ時間に定期タスク（当せん金の書き足し）が src/data を書きかえていて rebase が衝突したときは、
          # 最新の main を取り直し、その上で取り込みからやり直す（どちらの変更も失わない）
          redo_import() {
            git fetch origin main && git reset --hard origin/main
            if [ "$SCHEDULE" != '7 3,6,9 * * *' ]; then node tools/update-data.mjs loto || echo "::warning::ロト6・ロト7の取り込みに失敗"; fi
            node tools/update-data.mjs hub || echo "::warning::ミニロト・ビンゴ5・ナンバーズの取り込みに失敗した種類があります"
            if ! node tools/test.mjs > /tmp/redo-test.log 2>&1; then tail -n 40 /tmp/redo-test.log; git checkout -- src/data; echo "::error::取り込み直したあとのテストが通らないため、保存しません"; exit 1; fi
            git add src/data
            if git diff --cached --quiet; then echo "取り込み直したら新しい回はありませんでした（ほかの実行で保存済み）"; exit 0; fi
            git commit -m "当せん番号を更新"
          }
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then echo "保存しました"; exit 0; fi
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort || true
              echo "src/data が衝突しました（${i}回目）。最新を取り直して取り込みからやり直します"
              redo_import
            else
              echo "push に失敗（${i}回目）。少し待ってやり直します"
            fi
            sleep $((i * 10))
          done
          echo "::error::当せん番号の保存（push）に5回失敗しました"; exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: src }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  hub-failed:
    # 新しい4種類の取り込みに失敗したときだけ、公開のあとでこのジョブを失敗にする（実行結果が赤くなり、ログで分かる）
    needs: [build, deploy]
    if: always() && needs.build.outputs.hub_failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "ミニロト・ビンゴ5・ナンバーズの取り込みに失敗しました。build ジョブの「ミニロト・ビンゴ5・ナンバーズ」の手順のログを見てください。"
          exit 1
